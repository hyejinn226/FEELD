<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>저장된 엽서 — FEELD</title>
  <meta name="description" content="FEELD 전시에서 관객이 숲에서 보낸 엽서들" />
  <link rel="icon" type="image/png" href="assets/img/brand/favicon.png" />
  <link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo&display=swap" />
  <link rel="stylesheet" href="css/style.css?v=90" />
</head>
<body class="pg-body">

  <a class="logo" href="index.html" aria-label="FEELD 처음으로">
    <img class="logo__mark" src="assets/img/brand/symbol-lime.png" alt="FEELD" width="44" height="46" />
  </a>

  <!-- 저장된 엽서 모아보기 (js/postcard-gallery.js)
       전시(2026.11.20~22)에서 관객이 쓴 엽서 백업(assets/postcard/archive.json)을 정렬해서 보여 줌.
       글 면이 먼저 보이고, 누르면 사진 면으로 뒤집힘. [엽서 저장]은 사진 면 + 글 면을 위아래로 붙인 PNG 한 장 -->
  <main class="pg">
    <header class="pg__head">
      <a class="pg__back" href="index.html#post-title">← 엽서 페이지로</a>
      <p class="pg__label">LETTER FROM THE FOREST</p>
      <h1 class="pg__title">저장된 엽서</h1>
      <p class="pg__count" aria-live="polite"></p>
      <p class="pg__hint">엽서를 누르면 앞뒤가 뒤집혀요.</p>
    </header>

    <ul class="pg__grid" aria-label="저장된 엽서 목록"></ul>

    <div class="pg__empty" hidden>
      <p>엽서를 불러오지 못했어요. 잠시 후 다시 열어 주세요.</p>
    </div>
  </main>

  <canvas class="cursor" aria-hidden="true"></canvas>
  <script src="js/main.js?v=22"></script>
  <script src="js/postcard-gallery.js?v=3"></script>
</body>
</html>
